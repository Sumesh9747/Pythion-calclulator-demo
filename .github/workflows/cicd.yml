
name: Python Calculator CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
        env:
          PYTHONPATH: .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: sumesh9747/python-calculator:latest

  deploy-to-ec2:
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest Docker image
        run: docker pull sumesh9747/python-calculator:latest

      - name: Stop old container
        run: docker rm -f python-calculator || true

      - name: Deploy new container
        run: |
          docker run -d \
            --name python-calculator \
            --restart unless-stopped \
            -p 8080:5000 \
            sumesh9747/python-calculator:latest

      - name: Verify deployment
        run: |
          docker ps
          docker logs --tail 50 python-calculator

